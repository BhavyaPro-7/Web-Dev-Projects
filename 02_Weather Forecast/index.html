<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Forescast</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <link rel="icon" href="favicon-32x32.png">
  </head>
  <body>
    <main class="app">
      <!-- Header  -->
      <header class="header">
        <h1>Weather</h1>
        <button id="theme">🌙</button>
      </header>
      <!-- Search Section -->
      <section class="search-section">
        <div class="search-box">
          <input type="text" placeholder="Search City..." id="city-input" />
          <button id="search-btn">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-search-icon lucide-search"
            >
              <path d="m21 21-4.34-4.34" />
              <circle cx="11" cy="11" r="8" />
            </svg>
          </button>
        </div>
        <button id="location-btn">📍 Use Current Location</button>
      </section>
      <section class="hero">
        <!-- Weather Card  -->
        <section class="weather-card">
          <div class="weather-icon" id="weather-icon"></div>
          <div class="temperature" id="temperature"></div>
          <h2 id="city-name"></h2>
          <p id="weather-description"></p>
          <span id="feels-like"> </span>
        </section>
        <!-- Weather Details  -->
        <section class="details-grid">
          <div class="details-card">
            <span class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-droplet-icon lucide-droplet"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg></span>
            <h4>Humidity</h4>
            <p id="Humidity"></p>
          </div>
          <div class="details-card">
            <span class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-wind-icon lucide-wind"><path d="M12.8 19.6A2 2 0 1 0 14 16H2"/><path d="M17.5 8a2.5 2.5 0 1 1 2 4H2"/><path d="M9.8 4.4A2 2 0 1 1 11 8H2"/></svg></span>
            <h4>Wind</h4>
            <p id="Wind"></p>
          </div>
          <div class="details-card">
            <span class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-wind-arrow-down-icon lucide-wind-arrow-down"><path d="M10 2v8"/><path d="M12.8 21.6A2 2 0 1 0 14 18H2"/><path d="M17.5 10a2.5 2.5 0 1 1 2 4H2"/><path d="m6 6 4 4 4-4"/></svg></span>
            <h4>Pressure</h4>
            <p id="Pressure"></p>
          </div>
          <div class="details-card">
            <span class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-radiation-icon lucide-radiation"><path d="M12 12h.01"/><path d="M14 15.4641a4 4 0 0 1-4 0L7.52786 19.74597 A 1 1 0 0 0 7.99303 21.16211 10 10 0 0 0 16.00697 21.16211 1 1 0 0 0 16.47214 19.74597z"/><path d="M16 12a4 4 0 0 0-2-3.464l2.472-4.282a1 1 0 0 1 1.46-.305 10 10 0 0 1 4.006 6.94A1 1 0 0 1 21 12z"/><path d="M8 12a4 4 0 0 1 2-3.464L7.528 4.254a1 1 0 0 0-1.46-.305 10 10 0 0 0-4.006 6.94A1 1 0 0 0 3 12z"/></svg></span>
            <h4>UV Index</h4>
            <p id="Index"></p>
          </div>
        </section>
      </section>
      <!-- Hourly forecast  -->
      <section class="hourly">
        <h3>Today's Forecast</h3>
        <div class="hourly-list"></div>
      </section>
    </main>
  </body>
</html>
